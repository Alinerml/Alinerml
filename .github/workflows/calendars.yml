name: Contribution calendar cards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/calendars.py', '.github/workflows/calendars.yml']
  schedule:
    - cron: '35 1 * * *'
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  calendars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Generate and validate public contribution calendars
        run: python3 scripts/calendars.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish calendar images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/isocalendar.svg profile/calendar-full.svg github-metrics/isocalendar.fullyear.svg github-metrics/calendar.full.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh contribution calendar cards'
          git pull --rebase
          git push
