name: Reference profile metrics
'on':
  workflow_dispatch:
    inputs:
      only_base:
        type: boolean
        default: false
  schedule:
  - cron: 0 0 * * *
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
  queue: max
jobs:
  card-0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: base
      uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
      with:
        filename: github-metrics/base.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        user: Alinerml
        # Avoid filtering all public repositories by the GITHUB_TOKEN installation.
        repositories_affiliations: ''
        template: classic
        config_timezone: Asia/Shanghai
        base: header, activity, community, repositories
        plugin_traffic: false
        plugin_lines: false
        plugin_introduction: true
        # GITHUB_TOKEN cannot query user.gists; keep the base card independent of it.
        plugin_gists: false
        plugins_errors_fatal: true
        config_animations: false
        config_base64: false
        retries: 0
        optimize: svg
        debug: true
  card-1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Indepth analysis
      uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
      with:
        filename: github-metrics/languages.indepth.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        base: ''
        plugin_languages: true
        plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake,
          lex, cmake, shell, gnuplot
        plugin_languages_indepth: true
        plugin_languages_details: lines, bytes-size
        plugin_languages_limit: 4
        plugin_languages_analysis_timeout: 15
        user: Alinerml
        repositories_affiliations: ''
        plugin_traffic: false
        plugins_errors_fatal: true
        config_animations: false
        config_base64: false
        retries: 0
        optimize: svg
        debug: true
    if: ${{ !inputs.only_base }}
  card-2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Using chartist charts
      uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
      with:
        filename: github-metrics/stargazers.chartist.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        base: ''
        plugin_stargazers: true
        plugin_stargazers_charts_type: chartist
        user: Alinerml
        repositories_affiliations: ''
        plugin_traffic: false
        plugins_errors_fatal: true
        config_animations: false
        config_base64: false
        retries: 0
        optimize: svg
        debug: true
    if: ${{ !inputs.only_base }}
  card-3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Recently starred
      uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
      with:
        filename: github-metrics/stars.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        base: ''
        plugin_stars: true
        plugin_stars_limit: 10
        user: Alinerml
        repositories_affiliations: ''
        plugin_traffic: false
        plugins_errors_fatal: true
        config_animations: false
        config_base64: false
        retries: 0
        optimize: svg
        debug: true
    if: ${{ !inputs.only_base }}
  card-4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Indepth analysis
      uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
      with:
        filename: github-metrics/followup.indepth.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        base: ''
        plugin_followup: true
        plugin_followup_indepth: true
        user: Alinerml
        repositories_affiliations: ''
        plugin_traffic: false
        plugins_errors_fatal: true
        config_animations: false
        config_base64: false
        retries: 0
        optimize: svg
        debug: true
    if: ${{ !inputs.only_base }}
  card-5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Comment reactions
      uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
      with:
        filename: github-metrics/reactions.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        base: ''
        plugin_reactions: true
        plugin_reactions_limit: 100
        plugin_reactions_details: percentage
        user: Alinerml
        repositories_affiliations: ''
        plugin_traffic: false
        plugins_errors_fatal: true
        config_animations: false
        config_base64: false
        retries: 0
        optimize: svg
        debug: true
    if: ${{ !inputs.only_base }}
  card-6:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Followers
      uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
      with:
        filename: github-metrics/people.followers.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        base: ''
        plugin_people: true
        plugin_people_limit: 300
        plugin_people_size: 36
        plugin_people_types: followers, following
        user: Alinerml
        repositories_affiliations: ''
        plugin_traffic: false
        plugins_errors_fatal: true
        config_animations: false
        config_base64: false
        retries: 0
        optimize: svg
        debug: true
    if: ${{ !inputs.only_base }}
  card-7:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Featured repositories
      uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
      with:
        filename: github-metrics/repositories.pinned.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        base: ''
        plugin_repositories: true
        plugin_repositories_featured: Alinerml/minigo, Alinerml/tiktok
        user: Alinerml
        repositories_affiliations: ''
        plugin_traffic: false
        plugins_errors_fatal: true
        config_animations: false
        config_base64: false
        retries: 0
        optimize: svg
        debug: true
    if: ${{ !inputs.only_base }}
  card-10:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Discussions
      uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
      with:
        filename: github-metrics/discussions.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        user: Alinerml
        repositories_affiliations: ''
        base: ''
        plugin_discussions: true
        plugin_discussions_categories_limit: 8
        plugin_traffic: false
        plugins_errors_fatal: true
        config_animations: false
        config_base64: false
        retries: 0
        optimize: svg
        debug: true
    if: ${{ !inputs.only_base }}
  public-activity:
    if: ${{ !inputs.only_base }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Verify public activity renderer
        run: python3 -m unittest discover -s scripts -p 'test_public_activity.py'
      - name: Generate public event cards
        run: python3 scripts/public_activity.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish public activity cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-metrics/activity.svg github-metrics/habits.charts.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public activity cards'
          git pull --rebase origin main
          git push origin HEAD:main
