name: Personal profile feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  waka:
    runs-on: ubuntu-latest
    steps:
      - name: Check WakaTime connection
        id: connection
        env:
          WAKA_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -n "$WAKA_KEY" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Update WakaTime section
        if: steps.connection.outputs.ready == 'true'
        uses: anmol098/waka-readme-stats@4db28e08bfd8bac570125799fe1cfdcb23a8c871
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          SHOW_LINES_OF_CODE: 'False'
          SHOW_PROFILE_VIEWS: 'False'
          SHOW_LANGUAGE_PER_REPO: 'False'
          SHOW_LOC_CHART: 'False'
          SHOW_SHORT_INFO: 'False'
          SHOW_PROJECTS: 'False'
          SHOW_TOTAL_CODE_TIME: 'False'
          SHOW_TITLE: 'True'
  blog:
    if: vars.BLOG_RSS_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: sarisia/actions-readme-feed@bdde7fdb36e19b030b77cf1f7b7f09db68219f32
        with:
          url: ${{ vars.BLOG_RSS_URL }}
          file: README.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh recent blog entries'
          git pull --rebase
          git push
