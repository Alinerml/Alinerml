name: Personal profile feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/personal-feeds.yml'
      - 'scripts/wakatime.py'
      - 'scripts/test_wakatime.py'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false
  queue: max

jobs:
  waka:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Verify WakaTime updater
        run: python3 -m unittest discover -s scripts -p 'test_wakatime.py'

      - name: Update WakaTime section and cards
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 scripts/wakatime.py

      - name: Commit changed WakaTime files
        run: |
          git add README.md
          for path in profile/wakatime-languages.svg profile/wakatime-editors.svg; do
            if [ -f "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo 'No WakaTime changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update WakaTime activity'
          git pull --rebase origin main
          git push origin HEAD:main
