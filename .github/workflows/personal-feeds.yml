name: Personal profile feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/personal-feeds.yml'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false
  queue: max

jobs:
  waka:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate WakaTime and GitHub development metrics
        uses: anmol098/waka-readme-stats@f3a05a90cddf436185171f5c2d91af3478fc10c3 # OAuth-compatible release
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PUSH_TOKEN: ${{ github.token }}
          SHOW_TITLE: 'True'
          SHOW_COMMIT: 'True'
          SHOW_DAYS_OF_WEEK: 'True'
          SHOW_TIMEZONE: 'True'
          SHOW_LANGUAGE: 'True'
          SHOW_EDITORS: 'True'
          SHOW_OS: 'True'
          SHOW_AI_CODE_TIME: 'True'
          SHOW_AI_CODING: 'True'
          SHOW_TOTAL_CODE_TIME: 'False'
          SHOW_LINES_OF_CODE: 'False'
          SHOW_LANGUAGE_PER_REPO: 'False'
          SHOW_LOC_CHART: 'False'
          SHOW_SHORT_INFO: 'False'
          SHOW_PROFILE_VIEWS: 'False'
          SHOW_PROJECTS: 'False'
          SHOW_UPDATED_DATE: 'True'
          LOCALE: 'en'
          UPDATED_DATE_FORMAT: '%d/%m/%Y %H:%M:%S UTC'
